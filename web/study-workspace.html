<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkNote · 학습 작업대</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #fbfcfe; color: #1f2937; }
  .topbar { position: sticky; top: 0; z-index: 70; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid #eef1f6; }
  .brand { flex: 0 0 auto; font-size: 20px; line-height: 24px; font-weight: 800; letter-spacing: -.02em; color: #1e293b; text-decoration: none; white-space: nowrap; }
  .scope-nav { min-width: 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .scope-nav::-webkit-scrollbar { display: none; }
  .scope-pill { flex: 0 0 auto; display: inline-flex; align-items: center; max-width: 240px; min-height: 38px; border: 1px solid #d8dee9; border-radius: 10px; padding: 8px 13px; background: #fff; color: #1e293b; font-size: .84rem; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scope-pill.home { border-color: #2563eb; background: #2563eb; color: #fff; }
  .scope-pill.menu::after { content: "▾"; flex: 0 0 auto; margin-left: 7px; color: #94a3b8; font-size: .7rem; }
  .scope-pill:hover { border-color: #93c5fd; }
  .scope-pill.home:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .scope-sep { flex: 0 0 auto; color: #cbd5e1; font-weight: 800; }
  .scope-menu { position: fixed; z-index: 90; min-width: 180px; max-width: min(360px, calc(100vw - 24px)); max-height: 320px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; padding: 6px; background: #fff; box-shadow: 0 14px 34px rgba(15,23,42,.16); }
  .scope-menu-item { display: block; width: 100%; border: 0; border-radius: 8px; padding: 9px 11px; background: transparent; color: #1e293b; text-align: left; font-size: .84rem; font-weight: 650; }
  .scope-menu-item:hover, .scope-menu-item:focus-visible { background: #eff6ff; color: #1d4ed8; outline: none; }
  .scope-menu-item[aria-selected="true"] { background: #dbeafe; color: #1d4ed8; }
  /* 현재 학습 범위(단원·자료) 영역. 상단 breadcrumb(.topbar/.scope-nav)과는 항상
     별도 줄이며, 단원·자료 선택기는 각자의 현재 정보 옆에 붙어 시각적으로 연결된다. */
  .document-context { display: flex; flex-direction: column; gap: 4px; padding: 12px 24px 6px; }
  .scope-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 10px; min-width: 0; }
  .scope-row-title { min-width: 0; color: #1e293b; font-size: 1.2rem; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
  .scope-row-file { min-width: 0; color: #64748b; font-size: .84rem; overflow-wrap: anywhere; }
  .context-picker { flex: 0 0 auto; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .context-picker::after { content: "▾"; margin-left: 7px; color: #94a3b8; font-size: .7rem; }
  .spacer { flex: 1; }
  .btn, button { border: 1px solid #d8dee9; background: #fff; color: #2563eb; border-radius: 8px; padding: 8px 12px; font-size: .84rem; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .icon-btn { border: none; background: transparent; color: #64748b; font-size: 1rem; padding: 4px 8px; cursor: pointer; }
  .mobile-only { display: none; }
  .mobile-only[hidden] { display: none !important; }
  [hidden] { display: none !important; }
  .panel-controls { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .panel-toggle { padding: 7px 10px; color: #475569; white-space: nowrap; }
  .panel-toggle[aria-pressed="true"] { border-color: #93c5fd; color: #1d4ed8; background: #eff6ff; }
  .panel-toggle-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  #app { width: min(720px, calc(100vw - 32px)); margin: 60px auto; text-align: center; color: #64748b; font-size: .95rem; line-height: 1.7; }
  #app.error-state, #app.empty-state { border: 1px dashed #d8dee9; border-radius: 14px; padding: 28px; background: #fff; }
  #app.error-state { border-color: #fecaca; color: #b91c1c; background: #fff7f7; }

  .workspace { --source-width: 620px; --toc-width: 220px; display: grid; grid-template-columns: minmax(280px, var(--source-width)) 10px minmax(180px, var(--toc-width)) 10px minmax(320px, 1fr); gap: 12px; padding: 16px 24px 32px; align-items: start; }

  .toc-panel, .concept-panel, .source-panel { background: #fff; border: 1px solid #e8ebf2; border-radius: 14px; box-shadow: 0 8px 24px rgba(15,23,42,.06); }
  .toc-panel, .source-panel { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 76px; }
  .concept-panel { min-height: 60vh; padding: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #eef1f6; font-weight: 800; color: #0f172a; position: sticky; top: 0; background: #fff; z-index: 1; }
  .notes-panel-head { margin: -16px -16px 16px; border-radius: 14px 14px 0 0; }

  #tocList { padding: 8px; }
  .toc-segment { margin-bottom: 6px; }
  .toc-segment-head { display: block; width: 100%; text-align: left; border: none; background: transparent; border-radius: 10px; padding: 9px 10px; font-size: .84rem; font-weight: 700; color: #1e293b; cursor: pointer; }
  .toc-segment.active > .toc-segment-head { background: #eff6ff; color: #1d4ed8; }
  .toc-pages { display: flex; flex-direction: column; gap: 2px; padding-left: 8px; }
  .toc-page { display: flex; gap: 8px; align-items: baseline; border: none; background: transparent; border-radius: 8px; padding: 6px 8px; text-align: left; cursor: pointer; font-size: .78rem; color: #475569; }
  .toc-page:hover { background: #f8fafc; }
  .toc-page.active { background: #dbeafe; color: #1d4ed8; font-weight: 700; }
  .toc-page-num { flex: 0 0 auto; color: #94a3b8; font-size: .72rem; }
  .toc-page.active .toc-page-num { color: #2563eb; }
  .toc-page-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .column-resizer { position: sticky; top: 76px; height: calc(100vh - 92px); min-height: 240px; border: 0; border-radius: 999px; padding: 0; background: transparent; cursor: col-resize; touch-action: none; }
  .column-resizer::before { content: ""; position: absolute; inset: 0 3px; border-radius: 999px; background: #dbe3ef; transition: background .15s, box-shadow .15s; }
  .column-resizer:hover::before, .column-resizer:focus-visible::before, body.layout-resizing .column-resizer::before { background: #60a5fa; box-shadow: 0 0 0 4px rgba(59,130,246,.13); }
  .column-resizer:focus-visible { outline: none; }
  body.layout-resizing { cursor: col-resize; user-select: none; }
  body.layout-resizing iframe { pointer-events: none; }

  .concept-card { border: 1px solid #eef1f6; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .lecture-note-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .lecture-note-toolbar > div { min-width: 0; }
  .lecture-note-add { flex: 0 0 auto; white-space: nowrap; }
  .lecture-note-card { border: 1px solid #bfdbfe; background: linear-gradient(145deg, #eff6ff, #fff); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .lecture-note-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #334155; font-size: .8rem; }
  .lecture-note-delete { border: 0; background: transparent; color: #94a3b8; padding: 4px 6px; font-size: .74rem; }
  .lecture-note-delete:hover { color: #dc2626; }
  .lecture-note-delete.armed { border: 1px solid #fecaca; background: #fff1f2; color: #b91c1c; }
  .lecture-note-name-input { width: 100%; margin-top: 10px; border: 1px solid #bfdbfe; background: rgba(255,255,255,.96); border-radius: 10px; padding: 9px 12px; color: #0f172a; font: inherit; font-size: .9rem; font-weight: 750; }
  .lecture-note-name-input::placeholder { color: #94a3b8; font-weight: 600; }
  .lecture-note-name-input:focus { outline: 3px solid rgba(59,130,246,.16); border-color: #60a5fa; }
  .lecture-note-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .lecture-note-title { color: #0f172a; font-size: 1rem; font-weight: 800; }
  .lecture-note-range { color: #64748b; font-size: .76rem; white-space: nowrap; }
  .lecture-note-hint { color: #64748b; font-size: .78rem; line-height: 1.45; margin-top: 5px; }
  .lecture-note-input { width: 100%; min-height: 132px; margin-top: 12px; border: 1px solid #bfdbfe; background: rgba(255,255,255,.92); border-radius: 10px; padding: 10px 12px; font-size: .9rem; line-height: 1.55; font-family: inherit; resize: vertical; }
  .lecture-note-input:focus { outline: 3px solid rgba(59,130,246,.16); border-color: #60a5fa; }
  .lecture-note-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 9px; }
  .note-tag { border-color: #cbd5e1; color: #475569; background: #fff; border-radius: 999px; padding: 5px 10px; font-size: .75rem; }
  .note-tag[aria-pressed="true"] { border-color: #2563eb; color: #1d4ed8; background: #dbeafe; }
  .lecture-note-footer .note-status { margin: 0 0 0 auto; }
  .concept-name { font-weight: 800; color: #0f172a; font-size: 1rem; }
  .concept-english { color: #64748b; font-size: .9em; font-weight: 650; }
  .concept-def { color: #475569; font-size: .86rem; margin-top: 6px; line-height: 1.5; }
  .occurrence-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .occurrence-chip { border: 1px solid #dbeafe; background: #eff6ff; color: #1d4ed8; border-radius: 999px; padding: 3px 10px; font-size: .74rem; font-weight: 700; }
  .occurrence-chip[aria-current="page"] { border-color: #2563eb; background: #2563eb; color: #fff; }
  .occurrence-more { border: 1px dashed #94a3b8; background: #fff; color: #475569; border-radius: 999px; padding: 3px 10px; font-size: .74rem; font-weight: 750; }
  .occurrence-more:hover, .occurrence-more:focus-visible { border-color: #2563eb; color: #1d4ed8; background: #eff6ff; }
  .note-label { display: block; margin-top: 12px; font-size: .76rem; font-weight: 700; color: #64748b; }
  .note-input { width: 100%; min-height: 64px; margin-top: 6px; border: 1px solid #d8dee9; border-radius: 10px; padding: 8px 10px; font-size: .85rem; font-family: inherit; resize: vertical; }
  .note-status { margin-top: 4px; font-size: .74rem; color: #94a3b8; min-height: 1em; }
  .note-status.saved { color: #059669; }
  .note-status.failed { color: #b91c1c; }
  .muted-note { color: #94a3b8; font-size: .85rem; padding: 12px; }

  .source-frame { width: 100%; height: calc(100vh - 160px); border: none; display: block; background: #f8fafc; }

  @media (min-width: 900px) and (max-width: 1400px) {
    .topbar { flex-wrap: wrap; }
    .panel-controls { order: 3; flex-basis: 100%; justify-content: flex-start; }
    .toc-panel, .source-panel, .column-resizer { top: 116px; }
    .toc-panel, .source-panel { max-height: calc(100vh - 130px); }
    .column-resizer { height: calc(100vh - 132px); }
  }

  @media (max-width: 899px) {
    .mobile-only { display: inline-flex; }
    .desktop-only { display: none !important; }
    .topbar { flex-wrap: wrap; padding: 10px 12px; }
    .scope-nav { order: 3; flex-basis: 100%; }
    .scope-pill { max-width: 200px; min-height: 34px; padding: 6px 10px; }
    .document-context { padding: 10px 12px 6px; gap: 6px; }
    .scope-row-title { font-size: 1.05rem; }
    .context-picker { max-width: none; }
    .lecture-note-toolbar { align-items: center; }
    .workspace { grid-template-columns: 1fr; padding: 12px 12px 24px; }
    .column-resizer { display: none; }
    .toc-panel, .source-panel {
      position: fixed; top: 0; bottom: 0; z-index: 65; width: min(400px, 92vw);
      max-height: none; box-shadow: 0 20px 60px rgba(15,23,42,.25);
      transition: transform .2s ease;
    }
    .toc-panel { left: 0; transform: translateX(-100%); }
    .toc-panel.open { transform: translateX(0); }
    .source-panel { left: 0; transform: translateX(-100%); }
    .source-panel.open { transform: translateX(0); }
    .toc-scrim, .source-scrim { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 60; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">LinkNote</a>
    <nav class="scope-nav" id="scopeNav" aria-label="학습 자료 경로"></nav>
    <span class="spacer"></span>
    <div class="panel-controls desktop-only" aria-label="학습 영역 표시 설정">
      <button type="button" class="panel-toggle" data-panel-toggle="source" aria-pressed="true">원문 숨기기</button>
      <button type="button" class="panel-toggle" data-panel-toggle="toc" aria-pressed="true">목차 숨기기</button>
      <button type="button" class="panel-toggle" data-panel-toggle="notes" aria-pressed="true">필기·설명 숨기기</button>
    </div>
    <span class="panel-toggle-status" id="panelToggleStatus" role="status" aria-live="polite"></span>
    <button type="button" id="sourceToggleBtn" class="btn mobile-only" onclick="StudyWorkspace.toggleSource()">원문</button>
    <button type="button" id="tocToggleBtn" class="btn mobile-only" onclick="StudyWorkspace.toggleToc()">목차</button>
    <a class="btn" href="/">My Library</a>
  </div>

  <section class="document-context" id="documentContext" aria-label="현재 단원과 자료"></section>

  <div id="app" class="loading">학습 작업대를 불러오는 중입니다…</div>

  <div class="workspace" id="workspace" hidden>
    <aside class="source-panel" id="sourcePanel" aria-label="원문">
      <div class="panel-head">
        <span>원문</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="btn" id="openFullBtn">자료 전체 열기</button>
          <button type="button" class="icon-btn desktop-only" data-panel-toggle="source" data-panel-short aria-label="원문 숨기기">숨기기</button>
          <button type="button" class="icon-btn mobile-only" onclick="StudyWorkspace.toggleSource(false)" aria-label="원문 닫기">✕</button>
        </div>
      </div>
      <div id="sourceBody"></div>
    </aside>
    <div class="source-scrim mobile-only" id="sourceScrim" onclick="StudyWorkspace.toggleSource(false)" hidden></div>

    <button type="button" class="column-resizer" id="sourceResizer" role="separator" aria-label="원문 영역 너비 조절" aria-orientation="vertical" aria-valuemin="280" aria-valuenow="620"></button>

    <aside class="toc-panel" id="tocPanel" aria-label="목차">
      <div class="panel-head">
        <span>목차</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="icon-btn desktop-only" data-panel-toggle="toc" data-panel-short aria-label="목차 숨기기">숨기기</button>
          <button type="button" class="icon-btn mobile-only" onclick="StudyWorkspace.toggleToc(false)" aria-label="목차 닫기">✕</button>
        </div>
      </div>
      <div id="tocList"></div>
    </aside>
    <div class="toc-scrim mobile-only" id="tocScrim" onclick="StudyWorkspace.toggleToc(false)" hidden></div>

    <button type="button" class="column-resizer" id="tocResizer" role="separator" aria-label="목차 영역 너비 조절" aria-orientation="vertical" aria-valuemin="180" aria-valuenow="220"></button>

    <main class="concept-panel" id="conceptPanel" aria-label="개념과 노트">
      <div class="panel-head notes-panel-head desktop-only">
        <span>필기·설명</span>
        <button type="button" class="icon-btn" data-panel-toggle="notes" data-panel-short aria-label="필기·설명 숨기기">숨기기</button>
      </div>
      <section id="lectureNotePanel" aria-label="수업 필기"></section>
      <div id="conceptList"></div>
    </main>
  </div>

<script src="/study-workspace-logic.js"></script>
<script src="/study-workspace.js"></script>
</body>
</html>
