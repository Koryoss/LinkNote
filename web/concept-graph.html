<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkNote · 개념 탐색기</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#fbfcfe; color:#1f2937; }
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:12px 24px; background:rgba(255,255,255,.94); backdrop-filter:blur(6px); border-bottom:1px solid #eef1f6; }
  .brand { font-size:1.18rem; font-weight:800; color:#1e293b; text-decoration:none; }
  .spacer { flex:1; }
  .btn, button { border:1px solid #d8dee9; background:#fff; color:#2563eb; border-radius:8px; padding:8px 12px; font-size:.84rem; font-weight:700; text-decoration:none; cursor:pointer; }
  .btn.primary { background:#2563eb; border-color:#2563eb; color:#fff; }
  main { width:min(1180px, calc(100vw - 32px)); margin:24px auto 44px; }
  h1 { font-size:1.55rem; color:#0f172a; }
  h2 { font-size:1rem; margin-bottom:12px; color:#1e293b; }
  .sub { margin-top:6px; color:#64748b; font-size:.9rem; line-height:1.55; }
  .grid { display:grid; grid-template-columns:240px minmax(0, 1fr); gap:14px; margin-top:18px; align-items:start; }
  section { background:#fff; border:1px solid #e8ebf2; border-radius:14px; padding:18px; box-shadow:0 8px 24px rgba(15,23,42,.06); }
  section.wide { grid-column:1/-1; }
  .stats { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; }
  .stat { border:1px solid #eef1f6; border-radius:12px; padding:12px; background:#f8fafc; }
  .stat small { display:block; color:#64748b; font-size:.74rem; margin-bottom:5px; }
  .stat strong { font-size:1.2rem; color:#0f172a; }
  .map-cards { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-top:14px; }
  .map-card { text-align:left; border:1px solid #e2e8f0; background:#fff; border-radius:12px; padding:12px; color:#1f2937; }
  .map-card small { display:block; color:#64748b; font-size:.72rem; margin-bottom:5px; }
  .map-card strong { display:block; color:#0f172a; font-size:1.05rem; }
  .map-card span { display:block; margin-top:6px; color:#475569; font-size:.78rem; line-height:1.35; }
  .map-card.active { border-color:#2563eb; box-shadow:0 0 0 2px rgba(37,99,235,.16); }
  .map-card { cursor:pointer; }
  .viewbar { display:flex; gap:8px; margin-bottom:14px; }
  .viewbar button { font-size:.9rem; padding:9px 16px; }
  .viewbar button.active { background:#2563eb; border-color:#2563eb; color:#fff; }
  .queue-list { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .queue-card { display:flex; align-items:center; gap:14px; border:1px solid #e2e8f0; border-left-width:4px; border-radius:12px; padding:12px 14px; background:#fff; cursor:pointer; transition:box-shadow .15s, transform .05s; }
  .queue-card:hover { box-shadow:0 6px 18px rgba(15,23,42,.08); }
  .queue-card:active { transform:scale(.997); }
  .queue-card.state-new { border-left-color:#94a3b8; }
  .queue-card.state-learning { border-left-color:#3b82f6; }
  .queue-card.state-review { border-left-color:#f97316; }
  .queue-card.state-mastered { border-left-color:#10b981; }
  .queue-rank { flex:0 0 auto; width:30px; height:30px; border-radius:999px; color:#fff; font-weight:800; font-size:.92rem; display:flex; align-items:center; justify-content:center; }
  .queue-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .queue-title { display:flex; align-items:center; gap:8px; }
  .queue-title strong { color:#0f172a; font-size:1rem; overflow-wrap:anywhere; }
  .qbadge { flex:0 0 auto; border-radius:999px; padding:2px 8px; font-size:.7rem; font-weight:800; }
  .qbadge.s-new { background:#f1f5f9; color:#475569; }
  .qbadge.s-learning { background:#eff6ff; color:#1d4ed8; }
  .qbadge.s-review { background:#fff7ed; color:#c2410c; }
  .qbadge.s-mastered { background:#ecfdf5; color:#047857; }
  .queue-meta { color:#94a3b8; font-size:.76rem; }
  .queue-reason { color:#475569; font-size:.84rem; line-height:1.45; }
  .queue-cta { flex:0 0 auto; color:#2563eb; font-weight:700; font-size:.82rem; text-decoration:none; white-space:nowrap; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0; }
  .legend-item { display:flex; align-items:center; gap:5px; font-size:.76rem; color:#475569; }
  .legend-item i { width:11px; height:11px; border-radius:3px; display:inline-block; }
  @media (max-width:560px){ .queue-card{flex-wrap:wrap;} .queue-cta{margin-left:44px;} }
  .modebar { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .modebar button.active { background:#2563eb; border-color:#2563eb; color:#fff; }
  .modebar button.secondary { margin-left:auto; border-color:#cbd5e1; color:#475569; }
  .lensbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .lensbar button.active { background:#2563eb; border-color:#2563eb; color:#fff; }
  .concept-rail { position:sticky; top:74px; max-height:calc(100vh - 94px); overflow:auto; }
  .concept-search { width:100%; border:1px solid #d8dee9; border-radius:9px; padding:9px 10px; font-size:.85rem; }
  .concept-list { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
  .concept-item { width:100%; text-align:left; color:#334155; border-color:#e2e8f0; padding:9px 10px; }
  .concept-item strong { display:block; color:#0f172a; font-size:.82rem; overflow-wrap:anywhere; }
  .concept-item span { display:block; color:#94a3b8; font-size:.7rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .concept-item.active { background:#eff6ff; border-color:#2563eb; }
  .relationship-panel { min-width:0; }
  .selected-concept { border:1px solid #bfdbfe; border-radius:14px; padding:16px; background:linear-gradient(145deg,#eff6ff,#fff); }
  .selected-concept-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .selected-concept h2 { margin-bottom:4px; font-size:1.25rem; overflow-wrap:anywhere; }
  .selected-concept-meta { color:#64748b; font-size:.8rem; }
  .selected-concept-summary { margin-top:10px; color:#334155; font-size:.88rem; line-height:1.55; }
  .primary-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .primary-actions .primary { background:#2563eb; border-color:#2563eb; color:#fff; }
  .relationship-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:22px 0 10px; }
  .relationship-heading h2 { margin-bottom:0; }
  .relationship-list { display:grid; gap:10px; }
  .relationship-item { border:1px solid #dbe3ef; border-left:4px solid #2563eb; border-radius:12px; padding:13px 14px; background:#fff; }
  .relationship-item-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .relationship-item strong { color:#0f172a; font-size:.98rem; overflow-wrap:anywhere; }
  .relationship-kind { flex:0 0 auto; border-radius:999px; padding:3px 8px; background:#eff6ff; color:#1d4ed8; font-size:.7rem; font-weight:800; }
  .relationship-meta { display:block; margin-top:3px; color:#64748b; font-size:.74rem; }
  .relationship-reason { margin-top:9px; color:#334155; font-size:.84rem; line-height:1.5; }
  .relationship-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .relationship-actions .btn, .relationship-actions button { padding:6px 9px; font-size:.76rem; }
  .evidence-panel { border-top:1px solid #eef1f6; margin-top:18px; padding-top:14px; }
  .detail-panel { grid-column:2; }
  .filters { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; align-items:end; margin-top:14px; }
  .filters label { color:#64748b; font-size:.74rem; font-weight:700; }
  .filters input, .filters select { width:100%; border:1px solid #d8dee9; border-radius:8px; padding:8px 10px; font-size:.85rem; margin-top:4px; background:#fff; }
  .filters .check { display:flex; align-items:center; gap:8px; margin-top:22px; }
  .filters .check input { width:auto; margin:0; }
  .warning { border:1px solid #fde68a; background:#fffbeb; color:#92400e; border-radius:12px; padding:10px 12px; font-size:.84rem; line-height:1.5; margin-top:12px; }
  .graph-wrap { position:relative; height:580px; border:1px solid #eef1f6; border-radius:12px; overflow:hidden; background:radial-gradient(circle at 50% 50%, #fff, #f8fafc); }
  svg { width:100%; height:100%; display:block; }
  .edge { stroke:#94a3b8; stroke-width:2.25; opacity:.9; }
  .edge.connected { stroke:#2563eb; stroke-width:3; opacity:1; }
  .edge.selected { stroke:#1d4ed8; stroke-width:3; opacity:1; }
  .edge.dimmed { opacity:.2; }
  .edge-hit { stroke:transparent; stroke-width:16; cursor:pointer; pointer-events:stroke; }
  .edge-label { fill:#64748b; font-size:10px; font-weight:700; paint-order:stroke; stroke:#fff; stroke-width:4px; pointer-events:none; }
  .node { cursor:pointer; }
  .node circle { fill:#eff6ff; stroke:#93c5fd; stroke-width:2; }
  .node.recalled circle { fill:#dbeafe; stroke:#2563eb; }
  .node.weak circle, .node.review circle { fill:#fff7ed; stroke:#f97316; }
  .node.new circle { fill:#f8fafc; stroke:#94a3b8; }
  .node.learning circle { fill:#eff6ff; stroke:#3b82f6; }
  .node.mastered circle { fill:#ecfdf5; stroke:#10b981; }
  .node.core circle { stroke:#7c3aed; }
  .node.bridge circle { stroke:#059669; }
  .node.recent circle { fill:#ecfeff; stroke:#0891b2; }
  .node.connected circle { stroke:#2563eb; stroke-width:3; }
  .node.selected circle { fill:#dbeafe; stroke:#1d4ed8; stroke-width:4; }
  .node.dimmed { opacity:.48; }
  .node text { font-size:12px; fill:#1f2937; font-weight:700; paint-order:stroke; stroke:#fff; stroke-width:3px; }
  .node.selected text { font-size:13px; }
  .badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .badge { border:1px solid #dbeafe; background:#eff6ff; color:#1d4ed8; border-radius:999px; padding:3px 8px; font-size:.72rem; font-weight:800; }
  .empty, .error { border:1px dashed #d8dee9; border-radius:12px; padding:18px; color:#64748b; background:#fff; margin-top:18px; }
  .error { border-color:#fecaca; color:#b91c1c; background:#fff7f7; }
  .detail { font-size:.88rem; line-height:1.6; }
  .detail dt { color:#64748b; font-size:.75rem; font-weight:800; margin-top:8px; }
  .detail dd { color:#111827; font-weight:700; overflow-wrap:anywhere; }
  .detail-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .learning-actions { border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-top:14px; background:#f8fafc; }
  .learning-actions h3, .connected-list h3, .quick-search h3 { font-size:.92rem; color:#1e293b; margin-bottom:8px; }
  .connected-list, .quick-search { border-top:1px solid #eef1f6; margin-top:14px; padding-top:12px; }
  .connected-item, .search-item { border:1px solid #eef1f6; border-radius:10px; background:#fff; padding:9px 10px; margin-top:8px; }
  .connected-item strong, .search-item strong { display:block; color:#0f172a; }
  .search-meta { display:block; color:#64748b; font-size:.76rem; margin:2px 0 4px; }
  .search-status { color:#64748b; font-size:.82rem; margin-top:8px; }
  .relation-card { border:1px solid #bfdbfe; background:#eff6ff; border-radius:12px; padding:11px 12px; margin-bottom:12px; }
  .relation-card strong { color:#1e3a8a; display:block; }
  .relation-card p { color:#334155; font-size:.82rem; line-height:1.5; margin-top:4px; }
  @media (max-width:1040px){ .grid{grid-template-columns:220px minmax(0,1fr);} .concept-rail{position:static;max-height:none;} }
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} .detail-panel{grid-column:1;} .stats,.filters,.map-cards{grid-template-columns:1fr 1fr;} .modebar button.secondary{margin-left:0;} .graph-wrap{height:500px;} .concept-rail{display:block;max-height:320px;} .selected-concept-head,.relationship-item-head{flex-direction:column;} }
  @media (max-width:560px){ .stats,.filters,.map-cards{grid-template-columns:1fr;} }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">LinkNote</a>
    <span class="spacer"></span>
    <a class="btn" href="/mypage.html">My Page</a>
    <a class="btn" href="/">My Library</a>
  </div>
  <main>
    <h1>개념 탐색기</h1>
    <p class="sub">하나의 개념을 중심으로 연결과 근거를 따라가며 공부하세요. 관련 자료 검색은 GPT/OpenAI 답변을 생성하지 않습니다.</p>
    <div id="app" class="empty">불러오는 중...</div>
  </main>
<script>
  const configuredApi = window.LINKNOTE_API_BASE || localStorage.getItem('ln_api_base') || '';
  const API = (configuredApi || (location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000')).replace(/\/$/, '');
  const token = () => localStorage.getItem('ln_token') || '';
  const headers = () => token() ? { Authorization:'Bearer ' + token() } : {};
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const DEFAULT_NODE_LIMIT = 9;
  const MODE_LIMITS = { understand:9, connection:9, review:9, core:18, memory:18, new:18, full:80 };
  const MODE_LABELS = {
    understand:'이해하기',
    review:'복습하기',
    core:'Core Map',
    connection:'연결 보기',
    memory:'Learning Memory Map',
    new:'New Concepts',
    full:'Full Knowledge Map'
  };
  const MODE_DESCRIPTIONS = {
    understand:'선택한 개념과 가장 강한 주변 연결을 관계 설명과 함께 보여줍니다.',
    review:'지금 복습하면 좋은 개념을 Review Priority 기준으로 우선 보여줍니다. Learning State, Missing Links, Recall 기록을 함께 설명합니다.',
    core:'여러 개념과 연결된 중심 개념을 보여줍니다.',
    connection:'선택한 개념 주변의 직접 연결을 보여줍니다.',
    memory:'내가 설명해본 개념과 AI 피드백이 있는 개념을 보여줍니다.',
    new:'아직 내 말로 설명해본 기록이 없는 개념을 보여줍니다.',
    full:'전체 구조를 탐색하는 고급 보기입니다.'
  };
  let currentGraphData = null;
  let currentVisibleGraph = {nodes:[], edges:[]};
  let currentMode = 'understand';
  let currentView = 'relationships';
  let selectedConcept = '';
  let selectedNodeId = '';
  let selectedEdgeKey = '';
  let detailRequestKey = '';
  const QUEUE_SIZE = 7;
  const STATE_KO = { NEW:'처음', LEARNING:'학습 중', REVIEW:'복습 시점', MASTERED:'익힘' };
  const COURSE_PALETTE = ['#2563eb','#7c3aed','#0891b2','#db2777','#059669','#d97706','#4f46e5','#0d9488'];
  const _courseColorCache = {};
  function courseColor(course){
    const key = String(course || '기타');
    if(!(key in _courseColorCache)){
      const idx = Object.keys(_courseColorCache).length % COURSE_PALETTE.length;
      _courseColorCache[key] = COURSE_PALETTE[idx];
    }
    return _courseColorCache[key];
  }
  async function getJSON(path){
    const r = await fetch(API + path, { headers: headers() });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(`${path} returned ${r.status} ${d.detail || r.statusText}`);
    return d;
  }
  const stat = (label, value) => `<div class="stat"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`;
  const STATE_LABELS = { NEW:'NEW', LEARNING:'LEARNING', REVIEW:'REVIEW', MASTERED:'MASTERED' };
  const TYPE_LABELS = { core:'CORE', bridge:'BRIDGE' };
  const hasType = (node, type) => Array.isArray(node.node_types) && node.node_types.includes(type);
  const learningState = node => String(node?.learning_state || (Number(node?.recall_count || 0) === 0 ? 'NEW' : (hasType(node, 'weak') ? 'REVIEW' : 'LEARNING'))).toUpperCase();
  const stateBadge = node => STATE_LABELS[learningState(node)] || 'LEARNING';
  const secondaryBadges = node => ['core','bridge'].filter(type => hasType(node, type)).map(type => TYPE_LABELS[type]);
  const nodeLabel = node => String(node?.label || node?.name || '').trim();
  const score = (node, key) => Number(node?.[key] || 0);
  const topNames = (items) => items.slice(0,3).map(nodeLabel).filter(Boolean).join(' · ') || '아직 없음';
  function daysSince(value){
    if(!value) return Infinity;
    const d = new Date(value);
    if(Number.isNaN(d.getTime())) return Infinity;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  function enrichNodes(nodes, edges){
    const byId = Object.fromEntries(nodes.map(node => [node.id, {...node}]));
    const neighbors = {};
    edges.forEach(edge => {
      if(!byId[edge.source] || !byId[edge.target]) return;
      (neighbors[edge.source] ||= []).push({id:edge.target, weight:Number(edge.weight || 0)});
      (neighbors[edge.target] ||= []).push({id:edge.source, weight:Number(edge.weight || 0)});
    });
    const degrees = Object.fromEntries(Object.keys(byId).map(id => [id, (neighbors[id] || []).length]));
    const degreeValues = Object.values(degrees).sort((a,b)=>b-a);
    const coreThreshold = degreeValues[Math.min(9, degreeValues.length - 1)] || 0;
    return Object.values(byId).map(node => {
      const nodeNeighbors = neighbors[node.id] || [];
      const neighborMeta = nodeNeighbors.map(n => byId[n.id]).filter(Boolean);
      const degree = nodeNeighbors.length;
      const unitSet = new Set(neighborMeta.map(n => `${n.course || ''}::${n.unit || ''}`));
      const courseSet = new Set(neighborMeta.map(n => n.course || ''));
      const weightedDegree = nodeNeighbors.reduce((sum,n)=>sum + Number(n.weight || 0), 0);
      const backendTypes = Array.isArray(node.node_types) ? node.node_types : [];
      const state = learningState(node);
      const isReview = state === 'REVIEW' || backendTypes.includes('review') || (backendTypes.includes('weak') && Number(node.recall_count || 0) > 0);
      const isCore = backendTypes.includes('core') || (degree > 0 && degree >= coreThreshold);
      const isBridge = backendTypes.includes('bridge') || (degree >= 2 && (unitSet.size >= 2 || courseSet.size >= 2));
      const isRecalled = backendTypes.includes('recalled') || Number(node.recall_count || 0) > 0;
      const isRecent = backendTypes.includes('recent') || daysSince(node.last_recalled_at) <= 14;
      const nodeTypes = backendTypes.length ? backendTypes : [state.toLowerCase(), isCore ? 'core' : '', isBridge ? 'bridge' : '', isRecent ? 'recent' : '', isRecalled ? 'recalled' : ''].filter(Boolean);
      const badges = [stateBadge(node), ...secondaryBadges({...node, node_types:nodeTypes})];
      return {...node, degree:node.degree ?? degree, weighted_degree:node.weighted_degree ?? weightedDegree, node_types:nodeTypes, is_review:isReview, is_weak:isReview, is_core:isCore, is_bridge:isBridge, is_recent:isRecent, is_recalled:isRecalled, badges};
    });
  }
  function graphPriority(node){
    if(Number.isFinite(Number(node.priority_score))) return Number(node.priority_score);
    return reviewPriority(node) + (node.is_core ? 18 : 0) + (node.is_bridge ? 16 : 0) + Number(node.degree || 0) * 5 + Number(node.weight || 0) * 2;
  }
  function reviewPriority(node){
    if(Number.isFinite(Number(node.review_priority))) return Number(node.review_priority);
    const state = learningState(node);
    if(state === 'NEW') return 70 + score(node,'centrality_score') * 0.06;
    if(state === 'MASTERED') return Math.max(0, 25 - (node.is_recent ? 8 : 0));
    return score(node,'review_score') || (45 + Number(node.missing_links_count || 0) * 12);
  }
  function corePriority(node){
    return score(node,'centrality_score') * 2 + Number(node.degree || 0) * 12 + score(node,'priority_score') * 0.25;
  }
  function memoryPriority(node){
    return score(node,'memory_score') * 2 + (hasType(node,'recent') ? 30 : 0) + Number(node.recall_count || 0) * 14;
  }
  function newPriority(node){
    return score(node,'centrality_score') + Number(node.weight || 0) * 8 + Number(node.degree || 0) * 10;
  }
  function modeFromUrl(){
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'understand';
    currentMode = MODE_LABELS[mode] ? mode : 'understand';
    selectedConcept = params.get('concept') || '';
    window._graphFilters = { course:params.get('course') || '', unit:params.get('unit') || '', weakOnly:false };
  }
  function setMode(mode, concept){
    currentMode = MODE_LABELS[mode] ? mode : 'understand';
    if(concept !== undefined) selectedConcept = concept || '';
    selectedEdgeKey = '';
    currentView = currentMode === 'full' ? 'map' : 'relationships';
    renderGraph(currentGraphData || {nodes:[], edges:[], stats:{}});
  }
  function setView(view){
    currentView = ['relationships','map','queue'].includes(view) ? view : 'relationships';
    renderGraph(currentGraphData || {nodes:[], edges:[], stats:{}});
  }
  function openFromQueue(id){
    currentView = 'relationships';
    centerNodeById(id);
  }
  function buildQueue(nodes){
    return enrichNodes(nodes, Array.isArray(currentGraphData?.edges) ? currentGraphData.edges : [])
      .slice()
      .sort((a,b)=>reviewPriority(b)-reviewPriority(a))
      .slice(0, QUEUE_SIZE);
  }
  function queueCardHTML(node, rank){
    const state = learningState(node);
    const reasons = Array.isArray(node.review_reason) && node.review_reason.length ? node.review_reason
      : (Array.isArray(node.why_shown) ? node.why_shown : []);

  const EDGE_TYPE_KO = {

    const ids = new Set(visibleNodes.map(node => node.id));
    const byId = Object.fromEntries(visibleNodes.map(node => [node.id, node]));
    const counts = {};
    const seen = new Set();
    return edges
      .filter(edge => ids.has(edge.source) && ids.has(edge.target))
      .sort((a,b)=>edgeRank(b, byId)-edgeRank(a, byId))
      .filter(edge => {

        if(seen.has(key)) return false;
        if((counts[edge.source] || 0) >= maxPerNode || (counts[edge.target] || 0) >= maxPerNode) return false;
        seen.add(key);

      const eligible = currentMode === 'review'

        : [...enriched].sort((a,b)=>graphPriority(b)-graphPriority(a));
      const requested = enriched.find(node => String(node.id || '') === String(selectedNodeId || ''))
        || enriched.find(node => nodeLabel(node).toLowerCase() === key || String(node.id || '').toLowerCase() === key);
      const selected = (requested && (currentMode !== 'review' || eligible.some(node => node.id === requested.id)) ? requested : null)
        || eligible[0]

      const byId = Object.fromEntries(enriched.map(node=>[node.id,node]));
      if(selected){
        selectedNodeId = selected.id || '';

      }
      const neighborIds = new Set([selected?.id].filter(Boolean));
      edges.filter(edge => edge.source === selected?.id || edge.target === selected?.id)
        .sort((a,b)=>edgeRank(b, byId)-edgeRank(a, byId))
        .slice(0, 8)
        .forEach(edge => { neighborIds.add(edge.source); neighborIds.add(edge.target); });
      sorted = enriched.filter(node => neighborIds.has(node.id)).sort((a,b)=>(a.id === selected?.id ? -1 : b.id === selected?.id ? 1 : graphPriority(b)-graphPriority(a)));
    } else if(currentMode === 'core'){
      sorted = enriched.filter(node => hasType(node,'core') || Number(node.centrality_score || 0) >= 60).sort((a,b)=>corePriority(b)-corePriority(a));
    } else if(currentMode === 'memory'){

    } else if(currentMode === 'new'){

    }
    const edgeLines = edges.map(edge => {
      const a = pos[edge.source], b = pos[edge.target];
      if(!a || !b) return '';
      const width = 1 + Math.min(1.2, Number(edge.normalized_weight || edge.weight || 0) / 100);
      const connected = selectedNodeId && (edge.source === selectedNodeId || edge.target === selectedNodeId);
      const dimmed = selectedNodeId && !connected;
      const cls = ['edge', connected ? 'connected' : '', edgeKey(edge) === selectedEdgeKey ? 'selected' : '', dimmed ? 'dimmed' : ''].filter(Boolean).join(' ');
      return `<line class="${cls}" data-source="${esc(edge.source)}" data-target="${esc(edge.target)}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${width}"><title>${esc(edge.reason || '')}</title></line>`;
    }).join('');
    const edgeHits = edges.map((edge,index) => {
      const a = pos[edge.source], b = pos[edge.target];
      if(!a || !b) return '';
      return `<line class="edge-hit" data-edge-index="${index}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(edge.reason || '연결 정보 보기')}</title></line>`;
    }).join('');
    const edgeLabels = currentMode === 'understand' ? edges.map(edge => {
      const a = pos[edge.source], b = pos[edge.target];
      if(!a || !b) return '';
      return `<text class="edge-label" text-anchor="middle" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-5}">${esc(edgeTypeLabel(edge))}</text>`;
    }).join('') : '';
    const nodeEls = nodes.map(node => {
      const p = pos[node.id] || {x:width/2,y:height/2};
      const isSelected = selectedNodeId && node.id === selectedNodeId;
      const isConnected = selectedNodeId && connectedIds.has(node.id);
      const isDimmed = selectedNodeId && !isSelected && !isConnected;
      const cls = ['node', learningState(node).toLowerCase(), node.is_review ? 'review' : '', node.is_recalled ? 'recalled' : '', node.is_core ? 'core' : '', node.is_bridge ? 'bridge' : '', node.is_recent ? 'recent' : '', isSelected ? 'selected' : '', isConnected && !isSelected ? 'connected' : '', isDimmed ? 'dimmed' : ''].filter(Boolean).join(' ');
      const r = Math.max(18, Math.min(38, 18 + Number(node.weight || 1) * 2));
      const label = labelVisibleIds.has(node.id) ? `<text text-anchor="middle" y="4">${esc(String(node.label || '').slice(0, 14))}</text>` : '';
      const stroke = courseColor(node.course);
      return `<g class="${cls}" data-id="${esc(node.id)}" transform="translate(${p.x},${p.y})"><title>${esc(nodeLabel(node) || node.id)} · ${esc(node.course || '')}</title><circle r="${r}" style="stroke:${esc(stroke)}"></circle>${label}</g>`;
    }).join('');
    svg.innerHTML = edgeLines + edgeHits + edgeLabels + nodeEls;
    svg.querySelectorAll('.edge-hit').forEach(el => {
      el.addEventListener('click', event => {
        event.stopPropagation();
        const edge = edges[Number(el.dataset.edgeIndex)];
        if(edge) showEdgeDetails(edge);
      });
    });
    svg.querySelectorAll('.node').forEach(el => {
      el.addEventListener('mouseenter', () => markGraphFocus(el.dataset.id));
      el.addEventListener('mouseleave', () => markGraphFocus(selectedNodeId));
      el.addEventListener('click', () => selectNode(byId[el.dataset.id]));
    });
    markGraphFocus(selectedNodeId);
  }
  function markGraphFocus(nodeId){
    const svg = document.getElementById('graphSvg');
    if(!svg) return;
    const focused = String(nodeId || '');
    const connectedIds = new Set();
    svg.querySelectorAll('.edge').forEach(el => {
      if(focused && (el.dataset.source === focused || el.dataset.target === focused)){
        connectedIds.add(el.dataset.source);
        connectedIds.add(el.dataset.target);
      }
    });
    svg.querySelectorAll('.node').forEach(el => {
      const id = el.dataset.id;
      const connected = !!focused && connectedIds.has(id);
      el.classList.toggle('connected', !!focused && connected && id !== focused);
      el.classList.toggle('selected', !!focused && id === focused);
      el.classList.toggle('dimmed', !!focused && id !== focused && !connected);
    });
    svg.querySelectorAll('.edge').forEach(el => {
      const connected = !!focused && (el.dataset.source === focused || el.dataset.target === focused);
      el.classList.toggle('connected', connected);
      el.classList.toggle('dimmed', !!focused && !connected);
    });
  }
  function selectNode(node){
    if(!node) return;
    selectedNodeId = node.id || '';
    selectedConcept = nodeLabel(node);
    selectedEdgeKey = '';
    centerNode(node);
  }
  function relationshipDetailsHTML(edge){
    if(!edge) return '<div class="relation-card"><strong>관계 카드를 먼저 확인해 보세요</strong><p>지도에서는 연결선을 선택하면 두 개념의 관계 근거를 다시 확인할 수 있습니다.</p></div>';
    const source = findNodeById(edge.source) || {};
    const target = findNodeById(edge.target) || {};
    return `<div class="relation-card"><strong>${esc(nodeLabel(source)||'개념')} ↔ ${esc(nodeLabel(target)||'개념')}</strong><p><b>${esc(edgeTypeLabel(edge))}</b> · 연결 강도 ${esc(edge.normalized_weight ?? '-')}<br>${esc(edge.reason || '저장된 개념 그래프에서 발견된 연결입니다.')}</p><div class="detail-actions"><button data-focus-id="${esc(source.id||'')}" onclick="centerNodeById(this.dataset.focusId)">${esc(nodeLabel(source)||'왼쪽 개념')} 중심</button><button data-focus-id="${esc(target.id||'')}" onclick="centerNodeById(this.dataset.focusId)">${esc(nodeLabel(target)||'오른쪽 개념')} 중심</button></div></div>`;
  }
  function showEdgeDetails(edge){
    selectedEdgeKey = edgeKey(edge);
    draw(currentVisibleGraph.nodes || [], currentVisibleGraph.edges || []);
    const target = document.getElementById('relationshipDetails');
    if(target) target.innerHTML = relationshipDetailsHTML(edge);
  }
  function connectedConceptsHTML(node){
    const visibleNodes = currentVisibleGraph.nodes || [];
    const visibleEdges = currentVisibleGraph.edges || [];
    const byId = Object.fromEntries(visibleNodes.map(item => [item.id, item]));
    const rows = visibleEdges
      .filter(edge => edge.source === node.id || edge.target === node.id)
      .sort((a,b)=>Number(b.weight || b.normalized_weight || 0)-Number(a.weight || a.normalized_weight || 0))
      .slice(0, 8)
      .map(edge => byId[edge.source === node.id ? edge.target : edge.source])
      .filter(Boolean)
      .map(other => `<button class="btn" data-focus-id="${esc(other.id)}" onclick="centerNodeById(this.dataset.focusId)">${esc(nodeLabel(other) || other.id)}</button>`)
      .join('');
    return `<div class="connected-list"><h3>Concept Connections</h3>${rows ? `<div class="detail-actions">${rows}</div>` : '<div class="search-item">현재 표시된 연결 개념이 없습니다. 이 개념 중심으로 보기를 눌러 주변 연결을 확인해보세요.</div>'}</div>`;
  }
  function searchResultsHTML(d){
    const list = (items, empty, renderItem) => items && items.length ? items.map(renderItem).join('') : `<div class="search-item">${esc(empty)}</div>`;
    return `<div class="quick-search"><h3>빠른 검색 결과</h3>
      <p class="sub">빠른 검색: GPT 답변 생성 없음 · ${esc(d.from_cache ? '캐시 결과' : '새 검색')}</p>
      <div class="search-card"><h4>관련 개념</h4>${list(d.related_concepts, '관련 개념을 찾지 못했습니다.', x=>`<div class="search-item"><strong>${esc(x.concept || '개념')}</strong><span class="search-meta">${esc(x.course || '')} · ${esc(x.unit || '')}</span>${esc(x.reason || '')}</div>`)}</div>
      <div class="search-card"><h4>관련 자료 / Chunk</h4>${list(d.sources, '직접 관련된 chunk를 찾지 못했습니다.', x=>`<div class="search-item"><strong>${esc(x.filename || '파일명 없음')}</strong><span class="search-meta">${esc(x.course || '')} · ${esc(x.unit || '')} · p.${esc(x.page || '-')} · ${esc(x.relevance_label || '관련성 높음')}</span>${esc(x.chunk_preview || '')}</div>`)}</div>
      <div class="search-card"><h4>Learning Memory / Recall</h4>${list(d.learning_memory_matches, '관련 Learning Memory/Recall 기록이 없습니다.', x=>`<div class="search-item"><strong>${esc(x.concept || '개념')}</strong><span class="search-meta">${esc(x.course || '')} · ${esc(x.unit || '')} · ${esc(x.created_at || '')}</span>${esc(x.improved_summary || x.answer_preview || '')}</div>`)}</div>
    </div>`;
  }
  async function quickSearchNode(id){
    const node = findNodeById(id);
    if(!node) return;
    const target = document.getElementById('quickSearchResults');
    if(!target) return;
    const requestKey = `${id}:${Date.now()}`;
    detailRequestKey = requestKey;
    target.innerHTML = '<p class="search-status">관련 자료 검색 중...</p>';
    const search_filter = {};
    if(node.course) search_filter.course = node.course;
    if(node.unit) search_filter.unit = node.unit;
    try{
      const r = await fetch(API + '/ask/search', {
        method:'POST',
        headers:{...headers(), 'Content-Type':'application/json'},
        body:JSON.stringify({
          question:`${nodeLabel(node)} 관련 자료 찾아줘`,
          scope:Object.keys(search_filter).length ? 'single' : 'multi',
          search_filter,
          limit:3
        })
      });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.detail || r.statusText);
      if(detailRequestKey === requestKey && String(selectedNodeId || '') === String(id || '') && document.body.contains(target)) target.innerHTML = searchResultsHTML(d);
    }catch(e){
      if(detailRequestKey === requestKey && document.body.contains(target)) target.innerHTML = `<div class="error">빠른 검색 실패: ${esc(e.message || e)}</div>`;
    }
  }
  function showDetails(node, notice=''){
    if(!node) return;
    const concept = encodeURIComponent(nodeLabel(node));
    const course = encodeURIComponent(node.course || '');
    const unit = encodeURIComponent(node.unit || '');
    const galleryUrl = `/?course=${course}&unit=${unit}`;
    const recallUrl = `/?course=${course}&unit=${unit}&concept=${concept}&action=recall`;
    document.getElementById('details').innerHTML = `<div id="relationshipDetails">${relationshipDetailsHTML(null)}</div><dl>
      <dt>개념</dt><dd>${esc(node.label || '')}</dd>
      <dt>과목 / 단원</dt><dd>${esc(node.course || '-')} · ${esc(node.unit || '-')}</dd>
      <dt>학습 상태</dt><dd>${esc(STATE_KO[learningState(node)] || learningState(node))}</dd>
      <dt>추천 학습</dt><dd>${esc(node.recommended_action || '처음으로 내 말로 설명해보세요.')}</dd>
    </dl>
    ${notice ? `<div class="warning">${esc(notice)}</div>` : ''}
    <div class="learning-actions">
      <h3>학습 도구</h3>
      <div class="detail-actions">
        <button data-focus-id="${esc(node.id)}" onclick="centerNodeById(this.dataset.focusId)">이 개념 중심으로 보기</button>
        <a class="btn" href="/learning-memory.html?concept=${concept}&course=${course}&unit=${unit}">Learning Memory 보기</a>
        <button onclick="quickSearchNode('${esc(node.id)}')">관련 자료 빠른 검색</button>
        <a class="btn" href="${galleryUrl}">관련 단원 열기</a>
        <a class="btn" href="${recallUrl}">설명해보기</a>
      </div>
      <p class="sub">관련 자료는 선택한 개념을 기준으로 자동 검색합니다. GPT 답변 생성 없음.</p>
      <div id="quickSearchResults"></div>
    </div>
    ${connectedConceptsHTML(node)}`;
    quickSearchNode(node.id);
  }
  async function loadGraph(){
    const saved = window._graphFilters || {};
    const courseEl = document.getElementById('course');
    const unitEl = document.getElementById('unit');
    const weakEl = document.getElementById('weakOnly');
    const course = courseEl ? courseEl.value.trim() : (saved.course || '');
    const unit = unitEl ? unitEl.value.trim() : (saved.unit || '');
    const weakOnly = weakEl ? !!weakEl.checked : !!saved.weakOnly;
    window._graphFilters = { course, unit, weakOnly };
    const params = new URLSearchParams();
    if(course) params.set('course', course);
    if(unit) params.set('unit', unit);
    if(weakOnly) params.set('weak_only', 'true');
    const data = await getJSON('/concept-graph/overview' + (params.toString() ? '?' + params.toString() : ''));
    renderGraph(data);
  }
  async function init(){
    const app = document.getElementById('app');
    if(!token()) { app.className='error'; app.innerHTML='로그인이 필요합니다.<div style="margin-top:12px"><a class="btn primary" href="/?next=%2Fconcept-graph.html" style="text-decoration:none">로그인하러 가기</a></div>'; return; }
    modeFromUrl();
    try { await loadGraph(); }
    catch(e){ app.className='error'; app.textContent='개념 탐색기를 불러오지 못했습니다: ' + e.message; }
  }
  init();
</script>
</body>
</html>
